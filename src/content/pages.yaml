- id: home
  title: Kyle Tranfaglia | Software Engineer
  description: Kyle Tranfaglia is a software engineer building full-stack, AI-powered products, with dual degrees in computer science and data science.
  heading: Kyle Tranfaglia
  intro: I co-founded Pitchfire, an AI platform for startups and investors, and lead its engineering, from the database schema to the AI layer. I bring a data scientist's habit of measuring what matters to everything I ship.
  headline: Software engineer *building AI products end to end*.
  about:
    - I like hard problems with real users on the other end. Right now that's Pitchfire, where I design, build, and run an AI platform that startups and investment teams rely on.
    - As co-founder and lead engineer, I've built the platform on my own so far, from the PostgreSQL data model and the React and TypeScript app to the AI analysis pipeline, background jobs, security, and production. It serves 150+ active users across 100+ firms, so the decisions I make on day one are the ones I live with at scale.
    - I got here through dual degrees in computer science and data science at Salisbury University, where I graduated summa cum laude and built research software along the way, including a music visualizer accepted at five conferences and a flood-risk tool for the City of Cambridge. I also tutored more than 1,000 students in math and computer science, which taught me to explain hard ideas plainly.
    - Before and alongside software, I spent seven years in hospitality, from my first host job to formal service at nearly 200 weddings. That's where I learned to stay calm under pressure and own the outcome, and I still work that way.
