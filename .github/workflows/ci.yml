name: CI

on:
  push:
    branches: [main, redesign]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from package.json "packageManager"
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm verify
        env:
          CI: true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      # Lighthouse (mobile) against the build from `pnpm verify`. Report only:
      # it never fails the build. Download the artifact to read the reports.
      - name: Lighthouse
        if: success()
        continue-on-error: true
        run: pnpm lighthouse

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 14
